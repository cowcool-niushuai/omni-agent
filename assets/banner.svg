<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="OmniAgent — local-first AI agent platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1A17"/>
      <stop offset="0.55" stop-color="#15201D"/>
      <stop offset="1" stop-color="#0B2A24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#59D6B3"/>
      <stop offset="1" stop-color="#7AD7F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#59D6B3" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#59D6B3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>

  <g opacity="0.65">
    <circle cx="1080" cy="58" r="4" fill="#59D6B3"/>
    <circle cx="1110" cy="92" r="2.5" fill="#7AD7F0"/>
    <circle cx="1050" cy="110" r="2" fill="#59D6B3"/>
    <circle cx="1150" cy="140" r="3" fill="#59D6B3" opacity="0.45"/>
    <circle cx="990" cy="58" r="2" fill="#7AD7F0" opacity="0.6"/>
  </g>

  <g transform="translate(72, 72)">
    <rect width="176" height="176" rx="44" fill="#F5F8F7" opacity="0.06" stroke="#59D6B3" stroke-opacity="0.45"/>
    <rect x="18" y="18" width="140" height="140" rx="34" fill="#15201D" stroke="#2E4A42"/>
    <text x="88" y="102" text-anchor="middle" dominant-baseline="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="88" font-weight="900" fill="#F5F8F7">Ω</text>
    <circle cx="142" cy="34" r="10" fill="#59D6B3"/>
    <circle cx="88" cy="158" r="4" fill="#59D6B3" opacity="0.8"/>
  </g>

  <g transform="translate(300, 92)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="0" y="0" font-size="58" font-weight="800" fill="#F5F8F7" letter-spacing="-1.5">OmniAgent</text>
    <text x="2" y="58" font-size="22" font-weight="500" fill="#A8C4BA">本地优先 · 可审计 · 可恢复的通用 AI Agent 工作台</text>
    <text x="2" y="98" font-size="16" font-weight="400" fill="#7F9C92">Desktop · Web Console · CLI · MCP · RAG · Human-in-the-loop</text>
    <rect x="2" y="128" width="132" height="4" rx="2" fill="url(#accent)"/>
    <text x="150" y="133" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#59D6B3">v0.1.0</text>
  </g>
</svg>
