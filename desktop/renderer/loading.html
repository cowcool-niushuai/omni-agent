<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:;">
  <title>OmniAgent</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1715;
      --panel: #16211e;
      --text: #edf5f2;
      --muted: #8fa39d;
      --accent: #59d6b3;
      --danger: #ff8b7d;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(420px 220px at 50% -10%, rgba(89, 214, 179, 0.16), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      user-select: none;
    }
    .shell {
      width: 100%;
      padding: 30px 34px 24px;
      text-align: center;
    }
    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 17px;
      background: linear-gradient(145deg, #1d312b, #13201c);
      border: 1px solid rgba(89, 214, 179, 0.28);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      font-size: 30px;
      font-weight: 900;
      color: var(--accent);
    }
    h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.02em;
      font-weight: 650;
    }
    .subtitle {
      margin: 8px auto 0;
      max-width: 340px;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.65;
    }
    .progress {
      width: 144px;
      height: 3px;
      margin: 22px auto 0;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.07);
    }
    .progress::after {
      content: "";
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: sweep 1.25s ease-in-out infinite;
    }
    .error .progress { display: none; }
    .error .logo {
      color: var(--danger);
      border-color: rgba(255, 139, 125, 0.35);
    }
    .error h1 { color: #ffd1cb; }
    .actions {
      display: none;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
    }
    .error .actions { display: flex; }
    button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 14px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }
    button:hover { background: #1d2c27; border-color: rgba(89, 214, 179, 0.35); }
    button.primary {
      background: #245f4f;
      border-color: #2f7c66;
      color: #f4fffb;
    }
    button.primary:hover { background: #2a705d; }
    button:disabled { opacity: 0.55; cursor: default; }
    .meta {
      margin-top: 14px;
      color: #60736d;
      font-size: 9.5px;
      line-height: 1.55;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-all;
    }
    @keyframes sweep {
      from { transform: translateX(-110%); }
      to { transform: translateX(330%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress::after { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <main class="shell" id="shell">
    <div class="logo">Ω</div>
    <h1 id="title">正在启动 OmniAgent</h1>
    <p class="subtitle" id="subtitle">正在初始化本地智能体引擎，请稍候…</p>
    <div class="progress" aria-hidden="true"></div>
    <div class="actions" id="actions">
      <button class="primary" id="retry">重试</button>
      <button id="logs">打开日志</button>
      <button id="quit">退出</button>
    </div>
    <div class="meta" id="meta"></div>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get('error');
    const logPath = params.get('logPath');
    const version = params.get('version');
    const shell = document.getElementById('shell');
    const meta = document.getElementById('meta');

    if (error) {
      shell.classList.add('error');
      document.getElementById('title').textContent = '启动失败';
      document.getElementById('subtitle').textContent = error;
    }
    if (logPath) meta.textContent = `日志：${logPath}`;
    else if (version) meta.textContent = `v${version}`;

    document.getElementById('retry').addEventListener('click', async (event) => {
      const button = event.currentTarget;
      button.disabled = true;
      button.textContent = '正在重试…';
      const result = await window.omniSplash.retry();
      if (!result || !result.ok) {
        button.disabled = false;
        button.textContent = '重试';
      }
    });
    document.getElementById('logs').addEventListener('click', () => {
      window.omniSplash.openLogs();
    });
    document.getElementById('quit').addEventListener('click', () => {
      window.omniSplash.quit();
    });
  </script>
</body>
</html>
