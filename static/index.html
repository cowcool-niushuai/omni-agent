<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniAgent - Codex Minimalist Edition</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Marked for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#F5F8F7',
              surface: '#FFFFFF',
              sidebar: '#FBFDFD',
              border: '#E3ECE9',
              borderHover: '#CDDED8',
              ink: '#15201D',
              muted: '#7A8C87',
              accent: '#59D6B3',
              accentDark: '#267F68',
              cardHover: '#FAFCFB'
            }
          },
          fontFamily: {
            sans: ['Manrope', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['IBM Plex Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Manrope', system-ui, -apple-system, sans-serif; background-color: #F5F8F7; color: #15201D; }
    code, pre, .font-mono { font-family: 'IBM Plex Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #D5E2DE; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #B8CCC6; }
    .prose pre { padding: 0.85rem 1.1rem; border-radius: 0.75rem; background: #F8FBFA; border: 1px solid #E3ECE9; color: #15201D; font-size: 0.82rem; }
    .prose table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: 0.82rem; }
    .prose th, .prose td { border: 1px solid #E3ECE9; padding: 0.5rem 0.85rem; text-align: left; }
    .prose th { background: #EDF3F1; color: #15201D; font-weight: 600; }
  </style>
</head>
<body class="h-screen flex overflow-hidden select-none bg-[#F5F8F7] text-[#15201D]">

  <!-- ============================================================================== -->
  <!-- 左侧极简导航栏 (参考 Codex / Mac 原生桌面体验) -->
  <!-- ============================================================================== -->
  <aside class="w-64 bg-[#FBFDFD] border-r border-[#E3ECE9] flex flex-col justify-between py-3 px-3">
    <div class="flex flex-col h-full overflow-hidden">
      <!-- 窗口控制点与应用标识 -->
      <div class="flex items-center justify-between px-2 py-2 mb-2">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-[#15201D] text-[#59D6B3] flex items-center justify-center font-bold text-xs shadow-sm">
            Ω
          </div>
          <span class="font-bold text-sm tracking-tight text-[#15201D]">OmniAgent</span>
        </div>
        <div class="w-2 h-2 rounded-full bg-[#59D6B3] title='在线中'"></div>
      </div>

      <!-- 核心动作 -->
      <button onclick="createNewSession()" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-semibold text-[#15201D] hover:bg-[#EDF3F1] transition-all mb-2">
        <i data-lucide="edit-3" class="w-4 h-4 text-[#7A8C87]"></i>
        <span>新对话</span>
      </button>

      <!-- 模块入口（去除任何多余说明标签） -->
      <nav class="space-y-0.5 mb-4">
        <button onclick="switchTab('chat')" id="nav-chat" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium bg-[#EDF3F1] text-[#15201D] transition-all">
          <i data-lucide="message-square" class="w-4 h-4 text-[#267F68]"></i>
          <span>工作台</span>
        </button>
        <button onclick="switchTab('workspace')" id="nav-workspace" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium text-[#7A8C87] hover:text-[#15201D] hover:bg-[#F2F6F5] transition-all">
          <i data-lucide="folder" class="w-4 h-4"></i>
          <span>工作区文件</span>
        </button>
        <button onclick="switchTab('skills')" id="nav-skills" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium text-[#7A8C87] hover:text-[#15201D] hover:bg-[#F2F6F5] transition-all">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          <span>技能库</span>
        </button>
        <button onclick="switchTab('mcp')" id="nav-mcp" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium text-[#7A8C87] hover:text-[#15201D] hover:bg-[#F2F6F5] transition-all">
          <i data-lucide="layers" class="w-4 h-4"></i>
          <span>MCP 服务</span>
        </button>
        <button onclick="switchTab('memory')" id="nav-memory" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium text-[#7A8C87] hover:text-[#15201D] hover:bg-[#F2F6F5] transition-all">
          <i data-lucide="database" class="w-4 h-4"></i>
          <span>记忆中枢</span>
        </button>
      </nav>

      <!-- 最近会话列表 -->
      <div class="flex-1 overflow-y-auto space-y-0.5 pr-1">
        <div class="text-[11px] font-medium text-[#7A8C87] px-3 py-1.5">最近记录</div>
        <div id="session-list" class="space-y-0.5"></div>
      </div>

      <!-- 底部工作区信息与设置 -->
      <div class="pt-3 border-t border-[#E3ECE9] flex items-center justify-between text-xs px-2 text-[#7A8C87]">
        <div class="flex items-center gap-2 truncate font-mono text-[11px]">
          <i data-lucide="terminal" class="w-3.5 h-3.5 shrink-0"></i>
          <span class="truncate">./workspace</span>
        </div>
        <span class="text-[10px] bg-[#E3ECE9] text-[#15201D] px-1.5 py-0.5 rounded font-mono">DeepSeek</span>
      </div>
    </div>
  </aside>

  <!-- ============================================================================== -->
  <!-- 主内容区域 (Codex 留白风格) -->
  <!-- ============================================================================== -->
  <main class="flex-1 flex flex-col h-full bg-[#F5F8F7] overflow-hidden relative">

    <!-- 1. CHAT & WORKFLOW TAB -->
    <div id="tab-chat" class="flex-1 flex flex-col h-full overflow-hidden">
      
      <!-- 顶栏控制 -->
      <header class="h-12 border-b border-[#E3ECE9]/70 px-6 flex items-center justify-between bg-[#F5F8F7]/80 backdrop-blur-sm">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-[#15201D]" id="current-session-title">主工作流</span>
          <span class="text-[11px] text-[#7A8C87] font-mono" id="current-session-id"></span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="clearCurrentChat()" class="p-1.5 rounded-lg text-[#7A8C87] hover:text-[#15201D] hover:bg-[#E3ECE9]/60 transition-all" title="清屏">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </header>

      <!-- 内容交互区域 -->
      <div id="messages-container" class="flex-1 overflow-y-auto px-6 py-6">
        
        <!-- 空状态：Codex 原生卡片布局 (我们该做什么？) -->
        <div id="empty-state" class="max-w-2xl mx-auto h-full flex flex-col justify-center items-center -mt-8">
          <h1 class="text-2xl font-bold text-[#15201D] mb-8 tracking-tight">我们该做什么？</h1>

          <!-- Codex 风格输入主卡片 -->
          <div class="w-full bg-[#FFFFFF] border border-[#E3ECE9] rounded-2xl p-4 shadow-sm hover:border-[#CDDED8] transition-all mb-4">
            <textarea
              id="hero-input"
              rows="3"
              placeholder="随心输入..."
              class="w-full bg-transparent border-0 focus:outline-none text-sm text-[#15201D] placeholder-[#9CA3AF] resize-none"
              onkeydown="handleHeroKeyDown(event)"
            ></textarea>
            
            <div class="flex items-center justify-between pt-2 border-t border-[#F0F4F2] mt-2">
              <div class="flex items-center gap-2 text-xs text-[#7A8C87] relative">
                <button onclick="openCustomModelModal()" class="p-1.5 rounded-lg hover:bg-[#F2F6F5] text-[#7A8C87] hover:text-[#15201D] transition-all" title="配置 API Key / 自定义模型">
                  <i data-lucide="sliders" class="w-4 h-4"></i>
                </button>
                <div class="relative">
                  <button onclick="toggleModelDropdown(event)" class="flex items-center gap-1.5 font-mono text-[11px] px-2.5 py-1 rounded-lg bg-[#F5F8F7] hover:bg-[#EBF2EF] text-[#15201D] border border-[#E3ECE9] transition-all">
                    <span id="active-model-label">DeepSeek-V3</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 text-[#7A8C87]"></i>
                  </button>
                  <!-- Model Selection Dropdown -->
                  <div id="model-dropdown" class="absolute left-0 bottom-8 mb-1 w-64 bg-[#FFFFFF] border border-[#E3ECE9] rounded-2xl shadow-xl py-1.5 hidden z-50 text-xs">
                    <div class="px-3 py-1 text-[10px] font-semibold text-[#7A8C87] uppercase tracking-wider">选择大模型基座</div>
                    <div id="model-dropdown-items" class="max-h-60 overflow-y-auto space-y-0.5 px-1"></div>
                    <div class="border-t border-[#E3ECE9] mt-1.5 pt-1 px-1">
                      <button onclick="openCustomModelModal()" class="w-full text-left px-2.5 py-1.5 text-xs text-[#267F68] font-semibold hover:bg-[#F5F8F7] rounded-lg flex items-center gap-1.5">
                        <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> 填入 API Key / 接入新厂商
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <button
                onclick="sendHeroMessage()"
                class="w-8 h-8 rounded-full bg-[#15201D] hover:bg-[#24332F] text-white flex items-center justify-center transition-all shadow-sm"
              >
                <i data-lucide="arrow-up" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- 快捷操作清单 (Codex 纯净排版，不堆叠任何说明废话) -->
          <div class="w-full space-y-1 text-xs">
            <div onclick="sendQuickPrompt('写一个快速排序算法并保存为 quick_sort.py，运行测试并输出结果')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-[#EBF2EF] cursor-pointer text-[#15201D] transition-all">
              <i data-lucide="code-2" class="w-4 h-4 text-[#267F68]"></i>
              <span class="font-medium">编写并执行 Python 算法脚本</span>
            </div>
            <div onclick="sendQuickPrompt('通过 MCP 工具查询当前系统数据库有哪些表，统计数据行数并以Markdown表格输出')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-[#EBF2EF] cursor-pointer text-[#15201D] transition-all">
              <i data-lucide="database" class="w-4 h-4 text-[#3975B9]"></i>
              <span class="font-medium">调用 MCP 服务查询数据库结构与统计</span>
            </div>
            <div onclick="sendQuickPrompt('派发一个专职【算法调研员】子智能体对比快排与归并，派发一个【实现专家】编写脚本测试，最后汇总')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-[#EBF2EF] cursor-pointer text-[#15201D] transition-all">
              <i data-lucide="git-branch" class="w-4 h-4 text-[#A576C2]"></i>
              <span class="font-medium">派发子智能体分工协同 (DeerFlow Sub-Agent)</span>
            </div>
            <div onclick="sendQuickPrompt('加载系统健康诊断技能 (system_diagnostics)，查看当前 Linux 服务器的内存使用与进程状态')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-[#EBF2EF] cursor-pointer text-[#15201D] transition-all">
              <i data-lucide="activity" class="w-4 h-4 text-[#E9A64E]"></i>
              <span class="font-medium">运行系统环境与性能健康诊断</span>
            </div>
            <div onclick="sendQuickPrompt('请执行 rm -rf ./workspace/test 试一试')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl hover:bg-[#EBF2EF] cursor-pointer text-[#C98B4E] transition-all">
              <i data-lucide="shield-alert" class="w-4 h-4 text-[#C98B4E]"></i>
              <span class="font-medium">测试高危指令安全权限拦截</span>
            </div>
          </div>
        </div>

        <!-- 对话流容器 (进入对话状态后展示) -->
        <div id="chat-stream" class="max-w-2xl mx-auto space-y-6 hidden"></div>
      </div>

      <!-- 底部固定输入卡片 (进入对话状态后浮现) -->
      <div id="chat-input-bar" class="p-4 bg-[#F5F8F7]/95 border-t border-[#E3ECE9]/70 hidden">
        <div class="max-w-2xl mx-auto bg-[#FFFFFF] border border-[#E3ECE9] rounded-2xl p-3 shadow-sm hover:border-[#CDDED8] transition-all">
          <textarea
            id="chat-input"
            rows="2"
            placeholder="随心输入..."
            class="w-full bg-transparent border-0 focus:outline-none text-xs text-[#15201D] placeholder-[#9CA3AF] resize-none"
            onkeydown="handleChatKeyDown(event)"
          ></textarea>
          <div class="flex items-center justify-between pt-1 border-t border-[#F0F4F2] mt-1">
            <div class="flex items-center gap-2 text-xs text-[#7A8C87]">
              <span class="font-mono text-[11px] px-2 py-0.5 rounded bg-[#F5F8F7] text-[#15201D]">DeepSeek-V3</span>
            </div>
            <button
              id="send-btn"
              onclick="sendChatMessage()"
              class="w-7 h-7 rounded-full bg-[#15201D] hover:bg-[#24332F] text-white flex items-center justify-center transition-all shadow-sm"
            >
              <i data-lucide="arrow-up" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. WORKSPACE TAB -->
    <div id="tab-workspace" class="hidden flex-1 flex flex-col h-full p-6 overflow-hidden">
      <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col overflow-hidden">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-base font-bold text-[#15201D]">工作区文件 (./workspace)</h2>
          <button onclick="loadWorkspaceFiles()" class="text-xs text-[#7A8C87] hover:text-[#15201D] flex items-center gap-1">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 刷新
          </button>
        </div>
        <div class="flex-1 grid grid-cols-3 gap-4 border border-[#E3ECE9] rounded-2xl overflow-hidden bg-[#FFFFFF] shadow-sm">
          <div class="border-r border-[#E3ECE9] p-3 overflow-y-auto space-y-1" id="workspace-files-list"></div>
          <div class="col-span-2 flex flex-col bg-[#FBFDFD] overflow-hidden">
            <div class="h-10 border-b border-[#E3ECE9] px-4 flex items-center justify-between text-xs text-[#7A8C87] font-mono">
              <span id="preview-filename">请选择文件</span>
              <span id="preview-size">--</span>
            </div>
            <pre class="flex-1 p-4 overflow-auto text-xs text-[#15201D] font-mono bg-[#FFFFFF]"><code id="preview-code">// 选择文件查看内容</code></pre>
          </div>
        </div>
      </div>
    </div>

    <!-- 3. SKILLS TAB -->
    <div id="tab-skills" class="hidden flex-1 flex flex-col h-full p-6 overflow-y-auto">
      <div class="max-w-3xl mx-auto w-full">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-base font-bold text-[#15201D]">技能库</h2>
          <button onclick="openNewSkillModal()" class="px-3 py-1.5 bg-[#15201D] hover:bg-[#24332F] text-white rounded-xl text-xs font-semibold shadow-sm">
            新增技能
          </button>
        </div>
        <div id="skills-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </div>

    <!-- 4. MCP SERVERS TAB -->
    <div id="tab-mcp" class="hidden flex-1 flex flex-col h-full p-6 overflow-y-auto">
      <div class="max-w-3xl mx-auto w-full">
        <h2 class="text-base font-bold text-[#15201D] mb-4">MCP 协议服务</h2>
        <div id="mcp-servers-list" class="space-y-3 mb-6"></div>
        <div class="text-xs font-semibold text-[#7A8C87] mb-2 uppercase">注册工具</div>
        <div id="mcp-tools-list" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
      </div>
    </div>

    <!-- 5. MEMORY TAB -->
    <div id="tab-memory" class="hidden flex-1 flex flex-col h-full p-6 overflow-y-auto">
      <div class="max-w-3xl mx-auto w-full space-y-6">
        <div>
          <h2 class="text-base font-bold text-[#15201D] mb-3">长期记忆</h2>
          <div id="memories-container" class="grid grid-cols-1 md:grid-cols-2 gap-2"></div>
        </div>
        <div>
          <h2 class="text-base font-bold text-[#15201D] mb-3">知识库</h2>
          <div id="knowledge-container" class="space-y-2"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- 模态框：新增技能 -->
  <div id="modal-new-skill" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-[#FFFFFF] border border-[#E3ECE9] rounded-2xl w-full max-w-md p-5 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-bold text-[#15201D]">新增技能 (SKILL.md)</h3>
        <button onclick="closeNewSkillModal()" class="text-[#7A8C87] hover:text-[#15201D]"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="space-y-2.5 text-xs">
        <input id="input-skill-id" placeholder="唯一标识 (如 data_cleaner)" class="w-full bg-[#F5F8F7] border border-[#E3ECE9] rounded-xl p-2.5 font-mono text-[#15201D]">
        <input id="input-skill-name" placeholder="技能名称" class="w-full bg-[#F5F8F7] border border-[#E3ECE9] rounded-xl p-2.5 text-[#15201D]">
        <input id="input-skill-desc" placeholder="激活条件简述" class="w-full bg-[#F5F8F7] border border-[#E3ECE9] rounded-xl p-2.5 text-[#15201D]">
        <textarea id="input-skill-content" rows="6" placeholder="# 操作规范..." class="w-full bg-[#F5F8F7] border border-[#E3ECE9] rounded-xl p-2.5 font-mono text-[#15201D]"></textarea>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <button onclick="closeNewSkillModal()" class="px-3 py-1.5 rounded-xl text-xs text-[#7A8C87] hover:bg-[#F2F6F5]">取消</button>
        <button onclick="submitNewSkill()" class="px-3.5 py-1.5 rounded-xl bg-[#15201D] text-white text-xs font-semibold">保存</button>
      </div>
    </div>
  </div>

  <!-- 模态框：配置 API Key 与切换模型 -->
  <div id="modal-custom-model" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-[#FFFFFF] border border-[#E3ECE9] rounded-2xl w-full max-w-md p-5 shadow-xl">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-bold text-[#15201D]">配置模型厂商与 API Key</h3>
        <button onclick="closeCustomModelModal()" class="text-[#7A8C87] hover:text-[#15201D]"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="space-y-2.5 text-xs">
        <div>
          <label class="block text-[#7A8C87] text-[11px] mb-1 font-medium">选择目标厂商</label>
          <select id="modal-provider-select" onchange="onProviderSelectChange()" class="w-full bg-[#F5F8F7] border border-[#E3ECE9] rounded-xl p-2.5 text-[#15201D]">
            <option value="deepseek">DeepSeek (默认官方)</option>
            <option value="openai">OpenAI (官方 / 兼容中转)</option>
            <option value="qwen">阿里通义千问 (DashScope)</option>
            <option value="siliconflow">硅基流动 (SiliconFlow)</option>
            <option value="ollama">本地私有化 (Ollama 本地端口)</option>
            <option value="custom">接入任意第三方兼容 OpenAI 格式 API</option>
          </select>
        </div>
        <div>
          <label class="block text-[#7A8C87] text-[11px] mb-1 font-medium">API 基础地址 (Base URL)</label>
          <input id="modal-base-url" placeholder="https://api.openai.com/v1" class="w-full bg-[#F5F8F7] border border-[#E3ECE9] rounded-xl p-2.5 font-mono text-[#15201D]">
        </div>
        <div>
          <label class="block text-[#7A8C87] text-[11px] mb-1 font-medium">API 密钥 (API Key)</label>
          <input id="modal-api-key" type="password" placeholder="sk-..." class="w-full bg-[#F5F8F7] border border-[#E3ECE9] rounded-xl p-2.5 font-mono text-[#15201D]">
        </div>
        <div id="custom-model-name-group" class="hidden">
          <label class="block text-[#7A8C87] text-[11px] mb-1 font-medium">模型名称 (Model Identifier)</label>
          <input id="modal-model-name" placeholder="例如: gpt-4o, claude-3-5-sonnet, deepseek-r1" class="w-full bg-[#F5F8F7] border border-[#E3ECE9] rounded-xl p-2.5 font-mono text-[#15201D]">
        </div>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <button onclick="closeCustomModelModal()" class="px-3 py-1.5 rounded-xl text-xs text-[#7A8C87] hover:bg-[#F2F6F5]">取消</button>
        <button onclick="submitProviderConfig()" class="px-3.5 py-1.5 rounded-xl bg-[#15201D] text-white text-xs font-semibold">保存并启用</button>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = 'sess_' + Math.random().toString(36).substring(2, 10);
    let isStreaming = false;
    let pendingPermission = false;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initSession();
      loadSessions();
      loadSkills();
      loadMCPStatus();
      loadWorkspaceFiles();
      loadMemories();
      loadModels();
    });

    let allModels = [];

    async function loadModels() {
      try {
        const res = await fetch('/api/models');
        const data = await res.json();
        allModels = data.models || [];
        const active = data.active;
        if (active) {
          document.getElementById('active-model-label').innerText = active.label.split(' ')[0];
        }
        renderModelDropdown();
      } catch(e) {}
    }

    function renderModelDropdown() {
      const container = document.getElementById('model-dropdown-items');
      if (!container) return;
      container.innerHTML = '';
      allModels.forEach(m => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between px-2.5 py-1.5 rounded-lg hover:bg-[#F5F8F7] cursor-pointer text-xs transition-all";
        item.innerHTML = `
          <div class="flex flex-col truncate pr-2">
            <span class="font-medium text-[#15201D] truncate">${m.label}</span>
            <span class="text-[10px] text-[#7A8C87] font-mono">${m.provider_name}</span>
          </div>
          ${m.is_active ? '<i data-lucide="check" class="w-3.5 h-3.5 text-[#267F68] shrink-0"></i>' : ''}
        `;
        item.onclick = (e) => {
          e.stopPropagation();
          selectModel(m.id);
        };
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    function toggleModelDropdown(e) {
      if (e) e.stopPropagation();
      const d = document.getElementById('model-dropdown');
      d.classList.toggle('hidden');
    }

    document.addEventListener('click', (e) => {
      const d = document.getElementById('model-dropdown');
      if (d && !d.classList.contains('hidden') && !d.contains(e.target)) {
        d.classList.add('hidden');
      }
    });

    async function selectModel(modelId) {
      try {
        const res = await fetch('/api/models/active', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ model_id: modelId })
        });
        const data = await res.json();
        if (data.active) {
          document.getElementById('active-model-label').innerText = data.active.label.split(' ')[0];
        }
        const d = document.getElementById('model-dropdown');
        if (d) d.classList.add('hidden');
        loadModels();
      } catch(e) {
        alert("切换模型失败: " + e);
      }
    }

    function openCustomModelModal() {
      const d = document.getElementById('model-dropdown');
      if (d) d.classList.add('hidden');
      document.getElementById('modal-custom-model').classList.remove('hidden');
      document.getElementById('modal-custom-model').classList.add('flex');
    }
    function closeCustomModelModal() {
      document.getElementById('modal-custom-model').classList.add('hidden');
      document.getElementById('modal-custom-model').classList.remove('flex');
    }

    function onProviderSelectChange() {
      const val = document.getElementById('modal-provider-select').value;
      const customGroup = document.getElementById('custom-model-name-group');
      const baseInput = document.getElementById('modal-base-url');
      
      if (val === 'deepseek') {
        baseInput.value = 'https://api.deepseek.com';
        customGroup.classList.add('hidden');
      } else if (val === 'openai') {
        baseInput.value = 'https://api.openai.com/v1';
        customGroup.classList.add('hidden');
      } else if (val === 'qwen') {
        baseInput.value = 'https://dashscope.aliyuncs.com/compatible-mode/v1';
        customGroup.classList.add('hidden');
      } else if (val === 'siliconflow') {
        baseInput.value = 'https://api.siliconflow.cn/v1';
        customGroup.classList.add('hidden');
      } else if (val === 'ollama') {
        baseInput.value = 'http://localhost:11434/v1';
        customGroup.classList.add('hidden');
      } else {
        baseInput.value = '';
        customGroup.classList.remove('hidden');
      }
    }

    async function submitProviderConfig() {
      const provider = document.getElementById('modal-provider-select').value;
      const baseUrl = document.getElementById('modal-base-url').value.trim();
      const apiKey = document.getElementById('modal-api-key').value.trim();
      const modelName = document.getElementById('modal-model-name').value.trim();

      try {
        if (provider === 'custom') {
          if (!baseUrl || !modelName) {
            alert("请完整填写 Base URL 和模型标识");
            return;
          }
          await fetch('/api/models/custom', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              provider_name: "自定义厂商",
              base_url: baseUrl,
              api_key: apiKey || "none",
              model_name: modelName,
              label: `${modelName} (自定义)`
            })
          });
        } else {
          await fetch('/api/models/key', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
              provider_key: provider,
              api_key: apiKey,
              base_url: baseUrl
            })
          });
        }
        closeCustomModelModal();
        loadModels();
        alert("模型配置已生效！");
      } catch(e) {
        alert("保存失败: " + e);
      }
    }

    function switchTab(tab) {
      ['chat', 'skills', 'mcp', 'workspace', 'memory'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        const btn = document.getElementById(`nav-${t}`);
        if (t === tab) {
          el.classList.remove('hidden');
          btn.className = "w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium bg-[#EDF3F1] text-[#15201D] transition-all";
        } else {
          el.classList.add('hidden');
          btn.className = "w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-xs font-medium text-[#7A8C87] hover:text-[#15201D] hover:bg-[#F2F6F5] transition-all";
        }
      });
      lucide.createIcons();
    }

    async function initSession() {
      document.getElementById('current-session-id').innerText = currentSessionId;
    }

    async function switchSession(sessionId, title) {
      currentSessionId = sessionId;
      pendingPermission = false;
      document.getElementById('current-session-id').innerText = sessionId;
      const chatStream = document.getElementById('chat-stream');
      chatStream.innerHTML = '';
      try {
        const res = await fetch(`/api/sessions/${sessionId}/messages`);
        const messages = await res.json();
        if (!messages.length) {
          document.getElementById('empty-state').classList.remove('hidden');
          chatStream.classList.add('hidden');
          document.getElementById('chat-input-bar').classList.add('hidden');
          return;
        }
        document.getElementById('empty-state').classList.add('hidden');
        chatStream.classList.remove('hidden');
        document.getElementById('chat-input-bar').classList.remove('hidden');
        messages.forEach(m => {
          if (m.role === 'user') {
            const bubble = document.createElement('div');
            bubble.className = "flex justify-end";
            bubble.innerHTML = `<div class="max-w-xl bg-[#15201D] text-[#FFFFFF] rounded-2xl px-4 py-2.5 text-xs leading-relaxed shadow-sm">${escapeHtml(m.content || '').replace(/\n/g, '<br>')}</div>`;
            chatStream.appendChild(bubble);
          } else if (m.role === 'assistant') {
            const box = document.createElement('div');
            box.className = "space-y-2 text-xs";
            const thought = m.thought
              ? `<details class="group text-[11px] text-[#7A8C87] border border-[#E3ECE9] bg-[#FFFFFF] rounded-xl px-3 py-2"><summary class="font-medium text-[#15201D] cursor-pointer">思考过程</summary><div class="mt-2 text-[#4A5568] whitespace-pre-wrap font-mono pl-3 border-l-2 border-[#E3ECE9]">${escapeHtml(m.thought)}</div></details>`
              : '';
            box.innerHTML = `<div class="trace-steps space-y-1.5">${thought}</div><div class="final-answer prose prose-neutral text-xs max-w-none text-[#15201D] leading-relaxed pt-1"></div>`;
            box.querySelector('.final-answer').innerHTML = marked.parse(m.content || '');
            chatStream.appendChild(box);
          }
        });
        chatStream.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
        const container = document.getElementById('messages-container');
        container.scrollTop = container.scrollHeight;
      } catch (e) {
        console.error(e);
      }
    }

    async function loadSessions() {
      try {
        const res = await fetch('/api/sessions');
        const list = await res.json();
        const container = document.getElementById('session-list');
        container.innerHTML = '';
        list.slice(0, 10).forEach(s => {
          const item = document.createElement('div');
          item.className = "px-3 py-2 rounded-xl hover:bg-[#EDF3F1] text-[#7A8C87] hover:text-[#15201D] cursor-pointer text-xs flex items-center justify-between truncate transition-all";
          item.innerHTML = `<span class="truncate">${s.title}</span>`;
          item.onclick = () => switchSession(s.id, s.title);
          container.appendChild(item);
        });
      } catch(e) {}
    }

    function createNewSession() {
      currentSessionId = 'sess_' + Math.random().toString(36).substring(2, 10);
      pendingPermission = false;
      document.getElementById('current-session-id').innerText = currentSessionId;
      document.getElementById('chat-stream').innerHTML = '';
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('chat-stream').classList.add('hidden');
      document.getElementById('chat-input-bar').classList.add('hidden');
      initSession();
      loadSessions();
    }

    function clearCurrentChat() {
      document.getElementById('chat-stream').innerHTML = '';
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('chat-stream').classList.add('hidden');
      document.getElementById('chat-input-bar').classList.add('hidden');
    }

    function handleHeroKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendHeroMessage();
      }
    }
    function handleChatKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChatMessage();
      }
    }

    function sendQuickPrompt(text) {
      executePrompt(text);
    }

    function sendHeroMessage() {
      const input = document.getElementById('hero-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      executePrompt(text);
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      executePrompt(text);
    }

    // ============================================================================
    // Realtime ReAct Execution with Clean Collapsible Trace
    // ============================================================================
    function createAssistantBox() {
      const chatStream = document.getElementById('chat-stream');
      const assistantBox = document.createElement('div');
      assistantBox.className = "space-y-2 text-xs";
      assistantBox.innerHTML = `
        <div class="trace-steps space-y-1.5"></div>
        <div class="final-answer prose prose-neutral text-xs max-w-none text-[#15201D] leading-relaxed pt-1"></div>
      `;
      chatStream.appendChild(assistantBox);
      const ctx = {
        uid: Math.random().toString(36).substring(2, 8),
        stepsContainer: assistantBox.querySelector('.trace-steps'),
        answerContainer: assistantBox.querySelector('.final-answer'),
        fullMarkdown: ''
      };
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
      return ctx;
    }

    function appendThought(ctx, content) {
      const thoughtEl = document.createElement('details');
      thoughtEl.className = "group text-[11px] text-[#7A8C87] border border-[#E3ECE9] bg-[#FFFFFF] rounded-xl px-3 py-2 cursor-pointer transition-all";
      thoughtEl.innerHTML = `
        <summary class="font-medium text-[#15201D] flex items-center justify-between list-none">
          <span class="flex items-center gap-1.5"><i data-lucide="compass" class="w-3.5 h-3.5 text-[#267F68]"></i> 思考过程</span>
          <i data-lucide="chevron-down" class="w-3 h-3 group-open:rotate-180 transition-transform"></i>
        </summary>
        <div class="mt-2 text-[#4A5568] leading-relaxed font-mono whitespace-pre-wrap pl-5 border-l-2 border-[#E3ECE9]">${escapeHtml(content || '')}</div>
      `;
      ctx.stepsContainer.appendChild(thoughtEl);
      lucide.createIcons();
    }

    function appendToolStart(ctx, event) {
      const toolEl = document.createElement('details');
      toolEl.id = `tool-${event.tool_call_id || event.name}`;
      toolEl.className = "group text-[11px] border border-[#E3ECE9] bg-[#FFFFFF] rounded-xl px-3 py-2 transition-all";
      toolEl.innerHTML = `
        <summary class="font-medium text-[#15201D] flex items-center justify-between list-none cursor-pointer">
          <span class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-[#59D6B3]"></span>
            <span class="font-mono text-xs">${event.name}</span>
          </span>
          <i data-lucide="chevron-down" class="w-3 h-3 text-[#7A8C87] group-open:rotate-180 transition-transform"></i>
        </summary>
        <div class="mt-2 space-y-1.5 font-mono text-[10px]">
          <div class="bg-[#F5F8F7] p-2 rounded-lg text-[#4A5568] overflow-x-auto">${escapeHtml(JSON.stringify(event.arguments || {}, null, 2))}</div>
          <div class="tool-output-area text-[#7A8C87]">执行中...</div>
        </div>
      `;
      ctx.stepsContainer.appendChild(toolEl);
      lucide.createIcons();
    }

    function appendToolResult(ctx, event) {
      const toolEl = document.getElementById(`tool-${event.tool_call_id || event.name}`);
      if (!toolEl) return;
      const outArea = toolEl.querySelector('.tool-output-area');
      if (outArea) {
        outArea.innerHTML = `<div class="bg-[#F5F8F7] p-2 rounded-lg text-[#15201D] whitespace-pre-wrap max-h-36 overflow-y-auto">${escapeHtml(event.result || '')}</div>`;
      }
    }

    function appendSubagentStart(ctx, event) {
      const subEl = document.createElement('details');
      subEl.id = `subagent-${event.tool_call_id || event.role}`;
      subEl.className = "group text-[11px] border border-[#D5E2DE] bg-[#FAFCFB] rounded-xl px-3 py-2.5 transition-all";
      subEl.innerHTML = `
        <summary class="font-medium text-[#15201D] flex items-center justify-between list-none cursor-pointer">
          <span class="flex items-center gap-2">
            <i data-lucide="git-branch" class="w-3.5 h-3.5 text-[#267F68]"></i>
            <span>子智能体: ${event.role}</span>
          </span>
          <span class="text-[10px] text-[#7A8C87] font-mono">执行中</span>
        </summary>
        <div class="mt-2 space-y-1 font-mono text-[10px] text-[#4A5568]">
          <div class="bg-[#FFFFFF] p-2 rounded-lg border border-[#E3ECE9]">${escapeHtml(event.task || '')}</div>
          <div class="subagent-result text-[#7A8C87]"></div>
        </div>
      `;
      ctx.stepsContainer.appendChild(subEl);
      lucide.createIcons();
    }

    function appendSubagentDone(ctx, event) {
      const subEl = document.getElementById(`subagent-${event.tool_call_id || event.role}`);
      if (!subEl) return;
      const res = subEl.querySelector('.subagent-result');
      if (res) {
        res.innerHTML = `<div class="bg-[#F5F8F7] p-2 rounded-lg mt-1 text-[#15201D] whitespace-pre-wrap">${escapeHtml(event.result || '')}</div>`;
      }
      const status = subEl.querySelector('summary span:last-child');
      if (status) status.innerText = '已完成';
    }

    function appendPermission(ctx, event) {
      const sid = event.session_id || currentSessionId;
      const requests = (event.requests && event.requests.length)
        ? event.requests
        : [{ tool_name: event.tool_name, arguments: event.arguments, reason: event.reason }];
      const details = requests.map((r) => `
        <div class="border-t border-[#F0DFC8] pt-1.5 mt-1.5">
          <div class="font-mono text-[10px] text-[#3D2D22]">${escapeHtml(r.tool_name || '')}</div>
          <pre class="bg-[#FFFDF8] p-2 rounded-lg mt-1 text-[10px] text-[#5B4636] overflow-x-auto whitespace-pre-wrap">${escapeHtml(JSON.stringify(r.arguments || {}, null, 2))}</pre>
          ${r.reason ? `<div class="text-[10px] text-[#7A6A5E] mt-1">${escapeHtml(r.reason)}</div>` : ''}
        </div>
      `).join('');

      const warnEl = document.createElement('div');
      warnEl.id = `perm-${ctx.uid}-${event.request_id}`;
      warnEl.setAttribute('data-perm-card', '1');
      warnEl.className = "border border-[#C98B4E] bg-[#FFF8EC] rounded-xl p-3 text-xs space-y-2";
      warnEl.innerHTML = `
        <div class="font-semibold text-[#3D2D22] flex items-center gap-1.5">
          <i data-lucide="shield-alert" class="w-4 h-4 text-[#C98B4E]"></i>
          <span>高危操作待确认</span>
        </div>
        <div class="text-[11px] text-[#7A6A5E]">${escapeHtml(event.reason || '')}</div>
        ${details}
        <div class="flex items-center gap-2 pt-1">
          <button data-perm-id="${event.request_id}" onclick="confirmPermission('${event.request_id}', 'APPROVE', '${sid}')" class="px-3 py-1 bg-[#15201D] text-white rounded-lg text-xs font-semibold">允许执行</button>
          <button data-perm-id="${event.request_id}" onclick="confirmPermission('${event.request_id}', 'REJECT', '${sid}')" class="px-3 py-1 bg-[#E3ECE9] text-[#15201D] rounded-lg text-xs font-semibold">取消</button>
        </div>
      `;
      ctx.stepsContainer.appendChild(warnEl);
      lucide.createIcons();
    }

    function appendCompaction(ctx, event) {
      const note = document.createElement('div');
      note.className = "text-[10px] text-[#7A8C87] border border-[#E3ECE9] bg-[#FAFCFB] rounded-lg px-2.5 py-1.5";
      note.innerText = `已压缩 ${event.dropped || 0} 条较早消息（摘要 ${event.summary_chars || 0} 字）`;
      ctx.stepsContainer.appendChild(note);
    }

    function appendError(ctx, message) {
      const errEl = document.createElement('div');
      errEl.className = "border border-[#D98B8B] bg-[#FFF5F5] rounded-xl p-3 text-xs text-[#8B2E2E]";
      errEl.innerText = message || '发生未知错误';
      ctx.stepsContainer.appendChild(errEl);
    }

    function handleStreamEvent(event, ctx) {
      if (event.type === 'thought') {
        appendThought(ctx, event.content);
      } else if (event.type === 'tool_start') {
        appendToolStart(ctx, event);
      } else if (event.type === 'tool_result') {
        appendToolResult(ctx, event);
      } else if (event.type === 'subagent_start') {
        appendSubagentStart(ctx, event);
      } else if (event.type === 'subagent_done') {
        appendSubagentDone(ctx, event);
      } else if (event.type === 'permission_intercept') {
        pendingPermission = true;
        appendPermission(ctx, event);
      } else if (event.type === 'compaction') {
        appendCompaction(ctx, event);
      } else if (event.type === 'answer_chunk') {
        ctx.fullMarkdown += event.content || '';
        ctx.answerContainer.innerHTML = marked.parse(ctx.fullMarkdown);
        ctx.answerContainer.querySelectorAll('pre code').forEach((el) => {
          hljs.highlightElement(el);
        });
      } else if (event.type === 'answer_discard') {
        ctx.fullMarkdown = '';
        ctx.answerContainer.innerHTML = '';
      } else if (event.type === 'error') {
        appendError(ctx, event.message);
      }
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    async function streamSSE(url, payload, ctx) {
      const response = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        throw new Error(await response.text());
      }
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const dataStr = line.replace('data: ', '').trim();
          if (!dataStr) continue;
          try {
            handleStreamEvent(JSON.parse(dataStr), ctx);
          } catch (e) {
            console.error('Bad SSE event', e, dataStr);
          }
        }
      }
    }

    async function executePrompt(promptText) {
      if (isStreaming || pendingPermission) return;
      isStreaming = true;

      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('chat-stream').classList.remove('hidden');
      document.getElementById('chat-input-bar').classList.remove('hidden');

      const chatStream = document.getElementById('chat-stream');
      const userBubble = document.createElement('div');
      userBubble.className = "flex justify-end";
      userBubble.innerHTML = `
        <div class="max-w-xl bg-[#15201D] text-[#FFFFFF] rounded-2xl px-4 py-2.5 text-xs leading-relaxed shadow-sm">
          ${escapeHtml(promptText).replace(/\n/g, '<br>')}
        </div>
      `;
      chatStream.appendChild(userBubble);
      const ctx = createAssistantBox();

      try {
        await streamSSE('/api/chat/stream', {
          session_id: currentSessionId,
          message: promptText
        }, ctx);
      } catch (err) {
        console.error(err);
        appendError(ctx, `请求失败：${err.message || err}`);
      } finally {
        isStreaming = false;
        loadWorkspaceFiles();
        loadSessions();
      }
    }

    async function confirmPermission(reqId, action, sessionId) {
      if (isStreaming) return;
      const sid = sessionId || currentSessionId;
      const buttons = document.querySelectorAll(`button[data-perm-id="${reqId}"]`);
      buttons.forEach((btn) => { btn.disabled = true; btn.classList.add('opacity-50'); });

      const card = buttons.length ? buttons[0].closest('[data-perm-card]') : null;
      if (card) {
        const status = document.createElement('div');
        status.className = "text-[10px] text-[#7A6A5E] pt-1";
        status.innerText = action === 'APPROVE' ? '已允许，继续执行…' : '已拒绝，继续执行…';
        card.appendChild(status);
      }

      isStreaming = true;
      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('chat-stream').classList.remove('hidden');
      document.getElementById('chat-input-bar').classList.remove('hidden');
      const ctx = createAssistantBox();

      try {
        const res = await fetch('/api/permission/confirm', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ request_id: reqId, action, session_id: sid })
        });
        if (!res.ok) {
          throw new Error(await res.text());
        }
        await streamSSE('/api/chat/resume', {
          session_id: sid,
          request_id: reqId,
          action
        }, ctx);
      } catch (err) {
        console.error(err);
        appendError(ctx, `审批恢复失败：${err.message || err}`);
      } finally {
        isStreaming = false;
        pendingPermission = false;
        loadWorkspaceFiles();
        loadSessions();
      }
    }

    // ============================================================================
    // Simple Data Loaders
    // ============================================================================
    async function loadSkills() {
      const res = await fetch('/api/skills');
      const list = await res.json();
      const grid = document.getElementById('skills-grid');
      grid.innerHTML = '';
      list.forEach(s => {
        const c = document.createElement('div');
        c.className = "bg-[#FFFFFF] border border-[#E3ECE9] rounded-2xl p-4 shadow-sm hover:border-[#CDDED8] transition-all flex flex-col justify-between";
        c.innerHTML = `
          <div>
            <div class="font-bold text-xs text-[#15201D] mb-1">${s.name}</div>
            <div class="text-[11px] text-[#7A8C87] font-mono mb-2">${s.id}</div>
            <div class="text-[11px] text-[#4A5568] leading-relaxed mb-3">${s.description}</div>
          </div>
          <div class="flex flex-wrap gap-1">
            ${(s.tags || []).map(t => `<span class="text-[10px] bg-[#F5F8F7] text-[#7A8C87] px-2 py-0.5 rounded-full font-mono">${t}</span>`).join('')}
          </div>
        `;
        grid.appendChild(c);
      });
    }

    function openNewSkillModal() {
      document.getElementById('modal-new-skill').classList.remove('hidden');
      document.getElementById('modal-new-skill').classList.add('flex');
    }
    function closeNewSkillModal() {
      document.getElementById('modal-new-skill').classList.add('hidden');
      document.getElementById('modal-new-skill').classList.remove('flex');
    }
    async function submitNewSkill() {
      const skill_id = document.getElementById('input-skill-id').value.trim();
      const name = document.getElementById('input-skill-name').value.trim();
      const desc = document.getElementById('input-skill-desc').value.trim();
      const content = document.getElementById('input-skill-content').value.trim();
      if (!skill_id || !name || !content) return;
      await fetch('/api/skills', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ skill_id, name, description: desc, content, tags: ["custom"] })
      });
      closeNewSkillModal();
      loadSkills();
    }

    async function loadMCPStatus() {
      const res1 = await fetch('/api/mcp/servers');
      const servers = await res1.json();
      const sBox = document.getElementById('mcp-servers-list');
      sBox.innerHTML = '';
      servers.forEach(s => {
        const item = document.createElement('div');
        item.className = "bg-[#FFFFFF] border border-[#E3ECE9] rounded-2xl p-3.5 flex items-center justify-between shadow-sm";
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-[#EDF3F1] text-[#267F68] flex items-center justify-center font-bold text-xs">
              <i data-lucide="layers" class="w-4 h-4"></i>
            </div>
            <div>
              <div class="font-bold text-xs text-[#15201D]">${s.name}</div>
              <div class="text-[10px] text-[#7A8C87] font-mono">${s.command}</div>
            </div>
          </div>
          <span class="text-[11px] font-mono text-[#267F68] bg-[#DFF7EF] px-2 py-0.5 rounded-full font-semibold">Active</span>
        `;
        sBox.appendChild(item);
      });

      const res2 = await fetch('/api/mcp/tools');
      const tools = await res2.json();
      const tBox = document.getElementById('mcp-tools-list');
      tBox.innerHTML = '';
      tools.forEach(t => {
        const item = document.createElement('div');
        item.className = "bg-[#FFFFFF] border border-[#E3ECE9] rounded-xl p-3 text-xs shadow-sm";
        item.innerHTML = `
          <div class="font-mono font-semibold text-[#15201D] text-xs mb-1">${t.function.name}</div>
          <div class="text-[11px] text-[#7A8C87] leading-relaxed">${t.function.description}</div>
        `;
        tBox.appendChild(item);
      });
      lucide.createIcons();
    }

    async function loadWorkspaceFiles() {
      const res = await fetch('/api/workspace');
      const files = await res.json();
      const list = document.getElementById('workspace-files-list');
      list.innerHTML = '';
      if (files.length === 0) {
        list.innerHTML = '<div class="text-xs text-[#7A8C87] p-2">工作区为空</div>';
        return;
      }
      files.forEach(f => {
        const item = document.createElement('div');
        item.className = "p-2 rounded-xl hover:bg-[#EDF3F1] cursor-pointer text-xs flex items-center justify-between text-[#15201D] transition-all";
        item.innerHTML = `
          <div class="flex items-center gap-2 truncate font-mono text-xs">
            <i data-lucide="${f.type === 'dir' ? 'folder' : 'file-code'}" class="w-3.5 h-3.5 text-[#7A8C87]"></i>
            <span class="truncate">${f.path}</span>
          </div>
          <span class="text-[10px] text-[#7A8C87] font-mono">${f.size ? f.size + 'B' : ''}</span>
        `;
        if (f.type === 'file') {
          item.onclick = () => previewFile(f.path, f.size);
        }
        list.appendChild(item);
      });
      lucide.createIcons();
    }

    async function previewFile(path, size) {
      const res = await fetch(`/api/workspace/file?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      document.getElementById('preview-filename').innerText = path;
      document.getElementById('preview-size').innerText = size ? `${size} bytes` : '';
      const codeEl = document.getElementById('preview-code');
      codeEl.innerText = data.content;
      hljs.highlightElement(codeEl);
    }

    async function loadMemories() {
      const res = await fetch('/api/memories');
      const list = await res.json();
      const box = document.getElementById('memories-container');
      box.innerHTML = '';
      list.forEach(m => {
        const c = document.createElement('div');
        c.className = "bg-[#FFFFFF] border border-[#E3ECE9] rounded-xl p-3 text-xs shadow-sm";
        c.innerHTML = `
          <div class="font-mono text-[11px] text-[#267F68] font-bold mb-1">${m.key}</div>
          <div class="text-[#4A5568] text-xs leading-relaxed">${m.content}</div>
        `;
        box.appendChild(c);
      });

      const res2 = await fetch('/api/knowledge');
      const kdocs = await res2.json();
      const kBox = document.getElementById('knowledge-container');
      kBox.innerHTML = '';
      kdocs.forEach(k => {
        const c = document.createElement('div');
        c.className = "bg-[#FFFFFF] border border-[#E3ECE9] rounded-xl p-3 text-xs shadow-sm";
        c.innerHTML = `
          <div class="font-bold text-[#15201D] text-xs mb-1">${k.title}</div>
          <div class="text-[#7A8C87] text-xs leading-relaxed">${k.content}</div>
        `;
        kBox.appendChild(c);
      });
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>"']/g, function(c) {
        return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
      });
    }
  </script>
</body>
