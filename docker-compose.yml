services:
  omni-agent:
    build: .
    restart: unless-stopped
    ports:
      # Bind to localhost by default. Put a reverse proxy with TLS in front
      # before exposing the control plane to a network.
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8001
    volumes:
      - ./workspace:/app/workspace
      - ./data:/app/data
      - ./.env:/app/.env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
