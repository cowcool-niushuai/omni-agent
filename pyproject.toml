[project]
name = "omni-agent"
version = "0.1.0"
description = "OmniAgent — a local-first autonomous agent application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "openai>=1.60,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.4,<26.0",
    "httpx>=0.27,<1.0",
    "socksio>=1.0,<2.0",
    "rich>=13.9,<15.0",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "tiktoken>=0.8",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["workspace", "data", ".venv", "static"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["omni_agent"]
strict = true
follow_imports = "silent"
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
